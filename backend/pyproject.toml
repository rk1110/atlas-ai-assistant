[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas backend: FastAPI service with all AI logic"
requires-python = "==3.13.*"
# Exact pins only (CLAUDE.md). Rule: newest release that is >= 14 days old, unless a security fix needs newer.
dependencies = [
    "alembic==1.20.0",
    "anyio==4.15.1",
    "asyncpg==0.32.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.0",
    "langfuse==4.17.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "litellm==1.105.0",
    "neo4j==6.4.1",
    "pgvector==0.5.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pypdf==6.20.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.1.0",
    "sqlalchemy[asyncio]==2.1.4",
    "torch==2.14.1",
    "uvicorn[standard]==0.54.0",
]

# torch from PyTorch's CPU-only index on Linux (the Docker image): the default PyPI build can
# pull in GPU libraries we'd never use. macOS wheels on PyPI are already CPU/Apple-GPU only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages listed in [tool.uv.sources] come from here

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Explicit rule set, so upgrading ruff never silently changes what we enforce.
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# BLE blind `except Exception`, ASYNC async pitfalls, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "BLE", "ASYNC", "RUF"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # every `async def test_...` runs on the event loop, no decorator needed
# One event loop for the whole session: the cached DB engine's pooled connections belong to
# the loop that created them, so per-test loops would break them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
