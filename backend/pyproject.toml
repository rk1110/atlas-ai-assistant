[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas backend: FastAPI service with all AI logic"
requires-python = "==3.13.*"
# Exact pins only (CLAUDE.md). Rule: newest release that is >= 14 days old, unless a security fix needs newer.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
