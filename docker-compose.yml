# Atlas local stack.  Start: docker compose up -d   Status: docker compose ps
# All ${VARS} come from .env in this folder. ":?" makes compose fail fast if a required one is missing.
name: atlas

# Shared Langfuse settings, reused by langfuse-web and langfuse-worker via a YAML anchor (&/<<: *).
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3001
  SALT: ${LANGFUSE_SALT:?set in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # Langfuse stores raw trace events and media in S3-compatible storage (MinIO here).
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD:?set in .env}

services:
  # ---------- Data layer ----------
  postgres:
    # Postgres 17 with the pgvector extension pre-installed.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # localhost only: lets you run pytest / psql from your Mac
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10 

  redis:
    # Shared by Langfuse (job queue) and Atlas (cache/queue in later phases).
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # noeviction: Langfuse's job queue must never have keys silently dropped. Atlas cache keys will use TTLs.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Langfuse (observability) ----------
  clickhouse:
    # Column-oriented analytics DB where Langfuse stores traces (fast aggregation over millions of rows).
    image: clickhouse/clickhouse-server:25.12.11.4
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # S3-compatible object storage for Langfuse event payloads and media.
    # Pinned by digest: this registry only publishes a moving "latest" tag.
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    restart: unless-stopped
    entrypoint: sh
    # Create the "langfuse" bucket (a folder under /data) before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-worker:
    # Background processor: moves incoming trace events from Redis/MinIO into ClickHouse.
    # Note: Langfuse binds to the container's network address ($HOSTNAME), not 127.0.0.1,
    # so its health checks must target $HOSTNAME.
    image: langfuse/langfuse-worker:4.55.0
    restart: unless-stopped
    depends_on: &langfuse-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *langfuse-env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    # Langfuse UI + ingestion API. The backend sends traces here.
    image: langfuse/langfuse:4.55.0
    restart: unless-stopped
    depends_on: *langfuse-deps
    ports:
      - "3001:3000" # UI at http://localhost:3001 (3000 is our frontend)
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # Headless init: on FIRST start, create this org/project/user with these exact API keys,
      # so the backend's keys in .env work without any clicking in the UI.
      LANGFUSE_INIT_ORG_ID: atlas-org
      LANGFUSE_INIT_ORG_NAME: Atlas
      LANGFUSE_INIT_PROJECT_ID: atlas
      LANGFUSE_INIT_PROJECT_NAME: Atlas
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set in .env}
      LANGFUSE_INIT_USER_NAME: Atlas Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- Atlas ----------
  backend:
    build:
      context: .            # repo root, so the image can include prompts/ and config/
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Deliberately NOT waiting for Langfuse: tracing must never block the app from starting.
    # Only the variables the backend needs (not Langfuse's server secrets) — least privilege.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env}
      OTEL_SERVICE_NAME: atlas-backend  # how this service is labelled on every trace
      # 1 = use the cached embedding model only, never contact Hugging Face (see .env.example).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach Ollama on your Mac (also needed on Linux)
    ports:
      - "8000:8000"
    # Dev mode: apply pending DB migrations, then serve with auto-reload on save.
    # `exec` replaces the shell with uvicorn, so it receives Docker's stop signal directly.
    # (Production runs migrations as a separate one-off step, so several replicas never race.)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app/backend
      - ./prompts:/app/prompts
      - ./config:/app/config
      - ./data:/app/data:ro  # knowledge-base source documents (read-only: ingestion never edits them)
      # The embedding model (~130 MB) downloads from Hugging Face on first use; a named volume
      # keeps it across container rebuilds instead of re-downloading every time.
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      # Browser -> backend goes via your Mac (localhost). Server Components run INSIDE this
      # container, where "localhost" is the frontend itself, so they use Docker's network name.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes "shadow" these folders from the bind mount above, so the container keeps
      # its own Linux node_modules instead of seeing your Mac's (native binaries differ per OS).
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  hf_cache:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
