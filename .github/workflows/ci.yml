# CI: runs on every pull request and every push to main.
#
#   backend          ruff + pytest against a real Postgres + pgvector (fake LLM, fake embedder)
#   frontend         eslint + TypeScript type check + production build (next build)
#   images           builds both production images (Phase 7D), so a broken Dockerfile fails here
#   retrieval-evals  ingests the corpus with the REAL embedding model, then runs the golden set
#                    in retrieval-only mode and FAILS if hit rate or MRR drop below the gates.
#
# Why only retrieval evals here: they are free and deterministic (no model API, no secrets).
# Full evals (answers + LLM judge) cost money and need provider keys, so they run on demand:
#   docker compose exec backend python -m evals.run
# Action and tool versions are pinned (CLAUDE.md), like every dependency.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy credentials for the throwaway CI database only. Never real secrets.
  DATABASE_URL: postgresql+asyncpg://atlas:atlas-ci@localhost:5432/atlas
  TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas-ci@localhost:5432/atlas_test

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next typegen writes the PageProps/LayoutProps route types into .next/, which a fresh
      # checkout does not have (locally, next dev creates them).
      - run: npm run typecheck
      # Phase 7D: the production build catches what dev mode forgives (prerendering errors,
      # server/client boundary mistakes). Same command the prod image runs.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend] # only worth building what passed its checks
    steps:
      - uses: actions/checkout@v7.0.1
      # Plain `docker build` (preinstalled on the runner): no extra action to pin and trust.
      - run: docker build --target prod -f backend/Dockerfile -t atlas-backend:prod .
      - run: docker build --target prod -t atlas-frontend:prod frontend

  retrieval-evals:
    runs-on: ubuntu-24.04
    needs: backend # no point measuring retrieval if the tests fail
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      # The embedding (and reranker) models download from Hugging Face once, then come from
      # the cache. A new model name in rag.yaml = a new cache key = a fresh download.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/rag.yaml') }}
      - run: uv run alembic upgrade head
      # --text-only: the scanned PDF and the chart image need the vision model, and CI has no
      # model keys. Their questions (tag "multimodal") are left out of the gate below and run
      # on demand instead: docker compose exec backend python -m evals.run --tag multimodal
      - run: uv run python -m ingestion.run --text-only
      # The gates sit a little below today's scores (hybrid, 2026-10-30: hit rate 96%,
      # MRR 0.847 on 46 scored questions), so noise doesn't fail builds but a real drop does.
      # Raise them when retrieval improves; never lower them to make a PR pass.
      # 2026-11-17, first run on GitHub: hit rate 93%, MRR 0.822 (no Neo4j in CI).
      - run: >-
          uv run python -m evals.run --retrieval-only --exclude-tag multimodal
          --min-hit-rate 0.93 --min-mrr 0.80
