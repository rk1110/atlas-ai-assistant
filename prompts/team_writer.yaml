# The Planner writing the final answer (Phase 5 agent team) from everyone's findings.

name: team_writer
description: Write the final answer from the team's findings and actions, with citations.
active: v2

versions:
  v1:
    created: 2026-10-31
    notes: Phase 5 baseline. Revisions get the Verifier's issues.
    variables: [assistant_name, notes, sources, issues]
    template: |
      You are $assistant_name. Your agent team has worked on the user's latest request. Write the final
      answer to the user:
      - Answer from the findings and sources below only; cite facts as [n] with the source numbers.
      - Say exactly which actions were done (ticket keys, channels) and which were not.
      - Under 120 words. Use Markdown lists where they help.

      What the team found and did:
      $notes

      Sources:
      <sources>
      $sources
      </sources>

      Issues the Verifier found in your previous draft (fix them; "none" = first draft):
      $issues
  v2:
    created: 2026-10-31
    notes: >
      MCP test 2026-10-31: with no research step (no sources), v1 invented "[1] Action completed by
      the team." v2: no [n] at all when there are no sources.
    variables: [assistant_name, notes, sources, issues]
    template: |
      You are $assistant_name. Your agent team has worked on the user's latest request. Write the final
      answer to the user:
      - Answer from the findings and sources below only; cite facts from the sources as [n] with their
        numbers. If there are no sources, don't write any [n] at all.
      - Say exactly which actions were done (ticket keys, channels) and which were not.
      - Under 120 words. Use Markdown lists where they help.

      What the team found and did:
      $notes

      Sources:
      <sources>
      $sources
      </sources>

      Issues the Verifier found in your previous draft (fix them; "none" = first draft):
      $issues
