# RAG settings: how documents become searchable chunks, and how they're searched.
# Restart the backend after editing. Changing the embedding model or chunking means
# re-ingesting everything: `python -m ingestion.run --force`.

embedding:
  # A small, strong open-source model that runs on CPU: 33M parameters, 384 numbers per text.
  model: BAAI/bge-small-en-v1.5
  # Must match the vector(N) column in migration 0003. A model with a different size needs
  # a new migration (and a full re-ingest).
  dimensions: 384
  batch_size: 32
  # BGE models were trained with this instruction in front of *queries* (not passages).
  # Short questions and long passages look different; the prefix tells the model "this is a
  # search query", which measurably improves retrieval for BGE.
  query_prefix: "Represent this sentence for searching relevant passages: "

chunking:
  # Sizes are in tokens of the embedding model. BGE reads at most 512 tokens; anything
  # longer is silently cut off, so chunks must stay well below that.
  chunk_size: 350
  # Repeat the end of one chunk at the start of the next, so a sentence that straddles a
  # boundary is still whole in at least one chunk.
  chunk_overlap: 50
  # Pieces smaller than this are merged into a neighbour instead of becoming tiny chunks.
  min_chunk_size: 40

retrieval:
  top_k: 5
  # vector | keyword | hybrid | hybrid_rerank | graph | hybrid_graph  (backend/retrieval/__init__.py)
  # Compare them for free: python -m evals.run --retrieval-only --retriever all
  strategy: hybrid_graph
  # How many results each first stage returns before fusing / reranking. Deeper = better
  # recall, but the reranker's cost grows linearly with it.
  candidates: 20
  # Reciprocal Rank Fusion constant: 60 is the value from the original paper and the
  # common default. Smaller = the top ranks of each list matter more.
  rrf_k: 60

reranker:
  # A cross-encoder: reads (question, chunk) together and scores relevance.
  # Measured 2026-10-30 (docs/decisions.md): ms-marco-MiniLM-L-6-v2 is 5x faster but LOWERED
  # MRR on paraphrased questions; bge-reranker-base raised it, at ~1.5 s per 10 pairs on CPU.
  model: BAAI/bge-reranker-base
  # Only the first stage's top N are re-scored: cost grows linearly with N.
  candidates: 10
  batch_size: 16
  # (question + chunk) pairs are cut at this many tokens. Most chunks are ~140 tokens.
  max_length: 320

graph:
  # GraphRAG: which sources `python -m graph.build` extracts into Neo4j. Acme only: its org
  # chart and policies are what relationship questions ("who leads the team that owns X?")
  # are about.
  sources: [acme-docs]
  extraction_model: null  # null = the chat model in config/models.yaml (quality matters here)
  # How far to walk from the entities a question names. 2 = "the lead of the team that owns X".
  hops: 2
  max_facts: 20

query_rewriting:
  # Follow-ups ("and for fathers?") are rewritten into a standalone search query by a cheap
  # model before retrieval. Only when the conversation has earlier turns.
  enabled: true
  model: null  # null = the cheap model in config/models.yaml

sources:
  - name: gitlab-handbook
    kind: gitlab_handbook
    path: data/gitlab
  - name: acme-docs
    kind: acme_docs
    path: data/acme
  # Files uploaded on the Knowledge Base page. Stored in a Docker volume (not data/, which is
  # read-only in the container), so `ingestion.run --force` re-embeds them like everything else.
  - name: uploads
    kind: uploads
    path: uploads

uploads:
  max_file_mb: 10
  # Each needs a parser (ingestion/parsers). Scanned PDFs have no text layer: OCR is Phase 6.
  extensions: [.md, .markdown, .txt, .html, .htm, .pdf]
