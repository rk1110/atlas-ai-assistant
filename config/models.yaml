# Selectable chat models. Loaded by backend/core/model_catalog.py and served by GET /api/models.
#
# Field guide:
#   id               stable id the frontend sends back (never shown to users)
#   label            what the model dropdown shows
#   litellm_model    LiteLLM's "provider/model" string; LiteLLM routes the call to that provider
#   api_key_setting  name of the Settings field (core/config.py) holding this provider's key.
#                    Secrets stay in .env; this file only says WHICH secret to use.
#   api_base         fixed endpoint URL, or api_base_setting: a Settings field holding the URL
#   params           passed straight to litellm.acompletion() for this model
#   extra_headers /
#   extra_body       provider-specific request fields LiteLLM forwards untouched
#   structured_output  "native" (default): provider enforces JSON schemas; "prompt": it doesn't,
#                    so the schema goes in the prompt and the reply is validated + retried once
#   vision           true if the model can read images (Phase 6); defaults.vision answers them
#   pricing          USD per million input/output tokens (Phase 7B). Used before LiteLLM's bundled
#                    price map, which lags new models (it priced Haiku 5.5 at $0). Thinking
#                    tokens are billed as output tokens.
#
# Changing a model is a config change, not a code change (principle 2 + 8).

# Spending cap (Phase 7B). Every model call is recorded in the llm_usage table; once today's
# spend (UTC day, all users, chats + evals + ingestion) reaches daily_usd, the gateway refuses
# further calls with a "budget" error until tomorrow. It checks BEFORE a call, so one call can
# overshoot by its own cost. Calls to models without a price count as $0. null = no cap.
budget:
  daily_usd: 2.00

# Model routing (Phase 7B). Adds "Auto" to the model menu (and preselects it). In Auto, the
# intent classifier, which already runs on every message, also labels it simple or complex:
# simple one-fact lookups go to `simple`, everything else (and every agent action) to `complex`.
# A failed classification counts as complex. Measure: evals.run --model auto vs claude-sonnet.
routing:
  enabled: true
  label: Auto (Haiku or Sonnet)
  simple: claude-haiku
  complex: claude-sonnet

defaults:
  # Back on Claude since 2026-11-18 (Anthropic credit added). If credit runs out again, the
  # Ollama Cloud fallback is: chat: gpt-oss-cloud, cheap: gpt-oss-20b-cloud, vision: gemma4-cloud.
  chat: claude-sonnet     # preselected in the UI's model dropdown
  cheap: claude-haiku     # classification (step 4) and the eval runner (step 8)
  # Phase 6: messages with images go to this model (Claude reads images).
  vision: claude-sonnet

models:
  - id: claude-sonnet
    label: Claude Sonnet 5.5
    provider: anthropic
    litellm_model: anthropic/claude-sonnet-5-5
    api_key_setting: anthropic_api_key
    vision: true
    pricing: { input_per_mtok: 2.00, output_per_mtok: 10.00 }  # platform.claude.com, 2026-11-18
    params:
      max_tokens: 16000
      # Claude 5.5 models always think before answering; effort controls how much.
      # "low" keeps chat replies fast. No temperature: these models reject non-default sampling (400).
      reasoning_effort: low
    # Server-side refusal fallback (anthropic-beta: server-side-fallback-2026-07-01 plus
    # extra_body.fallbacks) removed 2026-11-18: our LiteLLM version forwards `extra_body` as a
    # literal field and Anthropic rejects it ("extra_body: Extra inputs are not permitted").

  - id: claude-haiku
    label: Claude Haiku 5.5
    provider: anthropic
    litellm_model: anthropic/claude-haiku-5-5
    api_key_setting: anthropic_api_key
    vision: true
    # Prompts up to 100K tokens; longer ones cost 5x (Atlas prompts stay far below that).
    pricing: { input_per_mtok: 0.10, output_per_mtok: 0.50 }  # platform.claude.com, 2026-11-18
    params:
      max_tokens: 4096
      reasoning_effort: low

  - id: gpt-oss-cloud
    label: GPT-OSS 120B (Ollama Cloud)
    provider: ollama_cloud
    litellm_model: ollama_chat/gpt-oss:120b
    api_key_setting: ollama_api_key
    api_base: https://ollama.com
    structured_output: prompt   # Ollama Cloud ignores JSON schemas (tested 2026-10-27)
    params:
      max_tokens: 4096
      # Temperature = randomness of token sampling. 0 = always the most likely token
      # (repeatable, dull); ~1 = more varied. 0.7 is a common chat default.
      temperature: 0.7

  - id: gpt-oss-20b-cloud
    label: GPT-OSS 20B (Ollama Cloud)
    provider: ollama_cloud
    litellm_model: ollama_chat/gpt-oss:20b
    api_key_setting: ollama_api_key
    api_base: https://ollama.com
    structured_output: prompt   # Ollama Cloud ignores JSON schemas (tested 2026-10-27)
    params:
      max_tokens: 2048
      temperature: 0.2   # low randomness: classification should give the same answer every time

  - id: gemma4-cloud
    label: Gemma 4 31B (Ollama Cloud)
    provider: ollama_cloud
    litellm_model: ollama_chat/gemma4:31b
    api_key_setting: ollama_api_key
    api_base: https://ollama.com
    structured_output: prompt
    # Reads images: screenshots, charts, scanned pages (Phase 6).
    vision: true
    params:
      max_tokens: 2048
      temperature: 0.3   # describing and reading images should be faithful, not creative

  - id: llama-local
    label: Llama 3.2 3B (local Ollama)
    provider: ollama_local
    litellm_model: ollama_chat/llama3.2
    api_base_setting: ollama_base_url   # reachable only when Ollama runs on your Mac (Phase 8)
    params:
      max_tokens: 2048
      temperature: 0.7
